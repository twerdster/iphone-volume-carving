<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Native carving replay</title><link rel="icon" href="data:,"><style>
*{box-sizing:border-box}body{margin:0;background:#edf3f7;color:#19364b;font:16px/1.45 system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:20px 26px}h1{font-size:29px;margin:4px 0}p{margin:8px 0}.meta{color:#436477;font-size:14px}.bar{display:flex;align-items:center;gap:16px;margin:13px 0}button{font:600 16px system-ui;padding:11px 16px;border:0;border-radius:7px;background:#087b90;color:white;cursor:pointer}button:disabled{background:#647d88;cursor:wait}progress{width:200px;height:15px}#status{font-weight:650}#stats{font:15px ui-monospace,monospace;color:#305269;min-height:23px}.panels{display:grid;grid-template-columns:265px 1fr;gap:18px;margin:14px 0}figure{margin:0;border:1px solid #cddce5;border-radius:10px;background:white;overflow:hidden}figcaption{padding:10px 13px;font-size:13px;font-weight:700}#photo{display:block;width:100%;height:auto;min-height:212px;object-fit:contain;background:#e0e8ef}#canvas{width:100%;height:415px;display:block;background:#102a3d}.note{padding:13px;font-size:13px;color:#466173}#credit{font-size:12px;color:#466173}#scope{font-size:13px}label{font-size:14px}@media(max-width:700px){main{padding:15px}.panels{grid-template-columns:1fr}#photo{max-height:150px;min-height:0}.bar{flex-wrap:wrap}#canvas{height:300px}}</style><main><p class="meta" id="platform">New desktop interface · actual native C++ execution</p><h1 id="title">Native carving replay</h1><p>36 real dinosaur masks/photos · supplied rounded camera matrices · 128³ grid · no live camera or pose tracking</p><div class="bar"><button id="run">Compute 36 views</button><progress id="progress" max="36" value="0"></progress><label><input id="orbit" type="checkbox"> Rotate computed display</label></div><div id="status" role="status">Connecting to local native replay…</div><p id="stats"></p><div class="panels"><figure><figcaption id="view-label">Input photograph · view 1/36</figcaption><img id="photo" src="/photo/1" alt="Current dinosaur input photograph"><p class="note">Silhouettes supply carving constraints. Calibrated cameras are given, not estimated by this interface. Photographs supply Freehand vertex colors.</p></figure><figure><figcaption id="render-title">Computed reconstruction · drag to rotate</figcaption><canvas id="canvas" aria-label="Interactive actual computed geometry"></canvas></figure></div><p id="scope"></p><p id="credit"></p></main><script>
const $=id=>document.getElementById(id),canvas=$('canvas'),gl=canvas.getContext('webgl',{antialias:true,preserveDrawingBuffer:true});let yaw=0,pitch=0,drag=null,ready=false,n=0,points=false,pollTimer,latestView=0,uiGeneration=0,activeRunId=null,pendingStart=false,loadedRunId=null;
if(!gl)throw Error('WebGL is required for the actual geometry viewer');
function shader(type,source){const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}
const program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,`attribute vec3 position;attribute vec4 color;uniform vec2 angle;uniform float aspect;varying vec4 rgb;void main(){float a=cos(angle.x),b=sin(angle.x),c=cos(angle.y),d=sin(angle.y);vec3 p=vec3(a*position.x-b*position.z,position.y,b*position.x+a*position.z);vec3 q=vec3(p.x,c*p.y-d*p.z,d*p.y+c*p.z);float z=3.5-q.z;gl_Position=vec4(q.x*2.5/aspect,q.y*2.5,1.020202*z-.2020202,z);gl_PointSize=3.;rgb=color;}`));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,`precision mediump float;varying vec4 rgb;uniform bool points;void main(){if(points&&distance(gl_PointCoord,vec2(.5))>.5)discard;gl_FragColor=vec4(rgb.rgb,1.);}`));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program);const angle=gl.getUniformLocation(program,'angle'),aspect=gl.getUniformLocation(program,'aspect'),isPoints=gl.getUniformLocation(program,'points');gl.enable(gl.DEPTH_TEST);gl.clearColor(.035,.095,.14,1);
function buffer(name,values,size,type,normalized){const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,values,gl.STATIC_DRAW);const loc=gl.getAttribLocation(program,name);gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,size,type,normalized,0,0)}
function draw(){canvas.width=canvas.clientWidth*devicePixelRatio;canvas.height=canvas.clientHeight*devicePixelRatio;gl.viewport(0,0,canvas.width,canvas.height);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);if(ready){gl.uniform2f(angle,yaw,pitch);gl.uniform1f(aspect,canvas.width/canvas.height);gl.uniform1i(isPoints,points);gl.drawArrays(points?gl.POINTS:gl.TRIANGLES,0,n)}}
canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(drag){yaw+=(e.clientX-drag[0])*.01;pitch+=(e.clientY-drag[1])*.01;drag=[e.clientX,e.clientY];draw()}};canvas.onpointerup=()=>drag=null;onresize=draw;
async function loadResult(s,generation){const [p,c]=await Promise.all([fetch('/result/positions.f32').then(r=>{if(!r.ok)throw Error('No completed geometry for this run');return r.arrayBuffer()}),fetch('/result/colors.rgba').then(r=>{if(!r.ok)throw Error('No completed geometry for this run');return r.arrayBuffer()})]);if(generation!==uiGeneration||s.run_id!==activeRunId||pendingStart)return;n=p.byteLength/12;points=!s.freehand;const raw=new Float32Array(p),low=[Infinity,Infinity,Infinity],high=[-Infinity,-Infinity,-Infinity];for(let i=0;i<n;i++)for(let k=0;k<3;k++){low[k]=Math.min(low[k],raw[i*3+k]);high[k]=Math.max(high[k],raw[i*3+k])}const center=low.map((x,k)=>(x+high[k])/2),scale=1.7/Math.max(...high.map((x,k)=>x-low[k])),display=new Float32Array(raw.length);for(let i=0;i<n;i++){display[i*3]=(raw[i*3+1]-center[1])*scale;display[i*3+1]=-(raw[i*3+2]-center[2])*scale;display[i*3+2]=-(raw[i*3]-center[0])*scale}buffer('position',display,3,gl.FLOAT,false);buffer('color',new Uint8Array(c),4,gl.UNSIGNED_BYTE,true);loadedRunId=s.run_id;ready=true;draw();$('stats').textContent=`${s.metrics.raw_voxels.toLocaleString()} raw voxels · ${s.metrics.observed_voxels.toLocaleString()} observed · ${s.metrics.triangles?s.metrics.triangles.toLocaleString()+' triangles':n.toLocaleString()+' boundary samples'} · ${s.metrics.elapsed_seconds.toFixed(2)} s measured run`}
async function poll(){const generation=uiGeneration;try{const s=await fetch('/status').then(r=>r.json());if(generation!==uiGeneration||pendingStart){pollTimer=setTimeout(poll,300);return;}if(activeRunId&&s.run_id&&s.run_id!==activeRunId){pollTimer=setTimeout(poll,300);return;}if(s.run_id)activeRunId=s.run_id;$('platform').textContent=s.platform+' · new local interface · actual native C++ replay';$('title').textContent=s.project;$('run').disabled=s.running;$('status').textContent=s.status;$('progress').value=s.view||0;document.title=s.project+' — '+s.platform+' native run';if(s.view&&s.view!==latestView){latestView=s.view;$('photo').src='/photo/'+s.view;$('view-label').textContent='Actual input photograph · view '+s.view+'/36';$('stats').textContent=`Native view ${s.view}/36 · raw ${s.raw_voxels.toLocaleString()} · observed ${s.observed_voxels.toLocaleString()}`}
$('scope').textContent=s.freehand?'Recovered C++ carving, marching cubes and vertex-color accumulation. Input-view reconstruction, not independent 3D accuracy; no live SDK.':'Original C++ ACCURATE carving. Display is a new labeled filter excluding never-in-image cells; raw count retained. Teal boundary points, not a mesh or recovered texture.';
$('credit').textContent=s.freehand?'Original: Alex Fish; supervisors Aaron Wetzler, Yaron Honen, Ron Kimmel. Dinosaur: Wolfgang Niem / Hannover, Oxford VGG, through Ben Tordoff. Existing notices/terms remain.':'Original: Sergey Kucher and Alex Povichuk; supervisor Aaron Wetzler. Dinosaur data borrowed from Freehand: Wolfgang Niem / Hannover, Oxford VGG. Existing notices/terms remain.';
if(s.complete&&!ready)await loadResult(s,generation);}catch(e){if(generation===uiGeneration&&!pendingStart)$('status').textContent='Local interface error: '+e.message}pollTimer=setTimeout(poll,300)}
$('run').onclick=async()=>{uiGeneration++;pendingStart=true;activeRunId=null;loadedRunId=null;ready=false;latestView=0;n=0;draw();$('stats').textContent='';$('status').textContent='Starting actual native C++ replay…';$('run').disabled=true;try{const r=await fetch('/run',{method:'POST'}),response=await r.json();if(!r.ok)throw Error(response.error||'request rejected');activeRunId=response.run_id;}catch(e){$('status').textContent='Cannot start native run: '+e.message;}finally{pendingStart=false;}};
let last=0;function animate(t){if(ready&&$('orbit').checked){yaw+=Math.min(100,t-last)*.0003;draw()}last=t;requestAnimationFrame(animate)}requestAnimationFrame(animate);draw();poll();
</script></html>
